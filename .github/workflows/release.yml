name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Use Node.js 24.x
      uses: actions/setup-node@v6
      with:
        node-version: 24.x
        cache: 'npm'
        registry-url: 'https://registry.npmjs.org'

    - name: Install dependencies
      run: npm ci

    - name: Run tests
      run: npm test
      timeout-minutes: 10
      env:
        CI: true

    - name: Build package
      run: npm run build

    - name: Verify build output
      run: |
        ls -la dist/
        if [ ! -f "dist/index.js" ]; then
          echo "Build failed: dist/index.js not found"
          exit 1
        fi

    - name: Check npm package version
      id: npm_package
      run: |
        PACKAGE_NAME=$(node -p "require('./package.json').name")
        PACKAGE_VERSION=$(node -p "require('./package.json').version")
        if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
          echo "published=true" >> "$GITHUB_OUTPUT"
          echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published"
        else
          echo "published=false" >> "$GITHUB_OUTPUT"
          echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is not published yet"
        fi

    - name: Publish to npm
      if: steps.npm_package.outputs.published != 'true'
      run: npm publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        name: Release ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
        body: |
          ## What's Changed

          See the [CHANGELOG](https://github.com/methodnumber13/asterdex-sdk/blob/main/CHANGELOG.md) for detailed changes.

          ## Installation

          ```bash
          npm install asterdex-sdk@${{ github.ref_name }}
          ```

          ## Documentation

          - [README](https://github.com/methodnumber13/asterdex-sdk#readme)
          - [API Documentation](https://github.com/methodnumber13/asterdex-sdk/blob/main/README.md#-complete-api-reference)
